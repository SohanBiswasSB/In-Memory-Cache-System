[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "in-memory-cache"
version = "0.1.0"
description = "Fixed-capacity key/value cache with per-key TTL and LRU eviction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pylint>=3.3",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "hypothesis>=6.100",
]

[tool.setuptools]
packages = ["cache"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["cache"]

[tool.pylint.format]
max-line-length = 88

[tool.pylint.basic]
# pylint reads a module level name bound to a function as a variable rather than
# a constant, so it wants MONOTONIC_CLOCK in snake_case. Setting good-names
# replaces pylint's defaults, hence the usual entries are repeated here.
good-names = ["i", "j", "k", "ex", "Run", "_", "MONOTONIC_CLOCK"]

[tool.pylint.design]
# InMemoryCache coordinates entries, recency, deadlines, weights, listeners and
# loading locks. Splitting that into smaller classes purely to satisfy a counter
# would spread one cohesive unit of state across several files. Its options are
# keyword-only, so a long signature does not hurt call sites.
max-attributes = 16
max-args = 10

[tool.pylint."messages control"]
# _Node and _Counters are data holders and do not need methods.
disable = ["too-few-public-methods"]
